<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #000;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .header h1 {
            color: #fff;
            margin-bottom: 20px;
        }

        .file-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .file-select {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border: 2px solid #333;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            background: #1a1a1a;
            color: #fff;
        }

        .file-select:focus {
            outline: none;
            border-color: #666;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #333;
            color: white;
        }

        .btn-primary:hover {
            background: #555;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }

        .btn-secondary {
            background: #444;
            color: white;
        }

        .btn-secondary:hover {
            background: #555;
        }

        .btn-success {
            background: #333;
            color: white;
        }

        .btn-success:hover {
            background: #555;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }

        .btn-danger {
            background: #666;
            color: white;
        }

        .btn-danger:hover {
            background: #888;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .main-content {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(255, 255, 255, 0.1);
        }

        .section-title {
            color: #fff;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-weight: 500;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #333;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
            background: #2a2a2a;
            color: #fff;
        }

        .form-control:focus {
            outline: none;
            border-color: #666;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }

        textarea.form-control {
            min-height: 100px;
            resize: vertical;
        }

        .card {
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background: #2a2a2a;
            transition: all 0.2s;
        }

        .card:hover {
            border-color: #555;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-title {
            font-weight: 600;
            color: #fff;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .array-item {
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            position: relative;
        }

        .array-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .array-item-title {
            font-weight: 600;
            color: #fff;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            padding: 8px 16px;
            background: #333;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #fff;
        }

        .toolbar-btn:hover {
            background: #555;
            border-color: #666;
        }

        .toolbar-btn.active {
            background: #555;
            border-color: #666;
        }

        .fields-container {
            display: grid;
            gap: 15px;
        }

        .field-row {
            display: grid;
            gap: 10px;
        }

        .field-row.two-columns {
            grid-template-columns: 1fr 1fr;
        }

        .field-row.three-columns {
            grid-template-columns: 1fr 1fr 1fr;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .status-message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
        }

        .status-success {
            background: #444;
        }

        .status-error {
            background: #666;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #fff;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .field-row.two-columns,
            .field-row.three-columns {
                grid-template-columns: 1fr;
            }

            .card-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .card-actions {
                width: 100%;
            }
        }

        .help-text {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Portfolio Admin</h1>
            <div class="file-controls">
                <select class="file-select" id="fileSelect">
                    <option value="">Select a file to edit...</option>
                    <option value="education">education.ts</option>
                    <option value="experience">experience.ts</option>
                    <option value="news">news.ts</option>
                    <option value="profile">profile.ts</option>
                    <option value="publications">publications.ts</option>
                </select>
                <button class="btn btn-success" id="saveBtn" disabled>Download File</button>
            </div>
        </div>

        <div class="main-content" id="mainContent">
            <div class="empty-state">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                <h3>Select a file to get started</h3>
                <p>Files load from GitHub automatically, then download to save changes</p>
            </div>
        </div>
    </div>

    <div class="modal" id="linkModal">
        <div class="modal-content">
            <h3 class="modal-title">Add Link</h3>
            <div class="form-group">
                <label>URL</label>
                <input type="text" class="form-control" id="linkUrl" placeholder="https://example.com">
            </div>
            <div class="form-group">
                <label>Link Text</label>
                <input type="text" class="form-control" id="linkText" placeholder="Click here">
            </div>
            <div class="form-group">
                <label>Open in new tab</label>
                <input type="checkbox" id="linkNewTab" checked>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" id="cancelLinkBtn">Cancel</button>
                <button class="btn btn-primary" id="insertLinkBtn">Insert</button>
            </div>
        </div>
    </div>

    <script>
        // State
        let currentFile = null;
        let currentData = null;
        let originalContent = '';

        // DOM Elements
        const fileSelect = document.getElementById('fileSelect');
        const saveBtn = document.getElementById('saveBtn');
        const mainContent = document.getElementById('mainContent');
        const linkModal = document.getElementById('linkModal');

        // File configurations
        const fileConfigs = {
            education: {
                path: 'components/data/education.ts',
                type: 'array',
                itemLabel: (item) => item.degree,
                fields: [
                    { name: 'degree', label: 'Degree', type: 'text' },
                    { name: 'institution', label: 'Institution', type: 'text' },
                    { name: 'dateRange.start', label: 'Start Date', type: 'text' },
                    { name: 'dateRange.end', label: 'End Date', type: 'text' },
                    { name: 'details', label: 'Details', type: 'textarea', array: true }
                ]
            },
            experience: {
                path: 'components/data/experience.ts',
                type: 'array',
                itemLabel: (item) => item.role,
                fields: [
                    { name: 'organization', label: 'Organization', type: 'text' },
                    { name: 'role', label: 'Role', type: 'text' },
                    { name: 'dateRange.start', label: 'Start Date', type: 'text' },
                    { name: 'dateRange.end', label: 'End Date', type: 'text' },
                    { name: 'supervisor', label: 'Supervisor', type: 'text' },
                    { name: 'logo', label: 'Logo Path', type: 'text' },
                    { name: 'responsibilities', label: 'Responsibilities', type: 'textarea', array: true }
                ]
            },
            news: {
                path: 'components/data/news.ts',
                type: 'array',
                itemLabel: (item) => item.date,
                fields: [
                    { name: 'date', label: 'Date', type: 'text' },
                    { name: 'title', label: 'Title', type: 'richtext' }
                ]
            },
            profile: {
                path: 'components/data/profile.ts',
                type: 'object',
                fields: [
                    { name: 'name', label: 'Name', type: 'text' },
                    { name: 'position', label: 'Position', type: 'text' },
                    { name: 'affiliation', label: 'Affiliation', type: 'text' },
                    { name: 'location', label: 'Location', type: 'text' },
                    { name: 'email', label: 'Email', type: 'text' },
                    { name: 'photo', label: 'Photo Path', type: 'text' },
                    { name: 'bio', label: 'Bio', type: 'richtext', array: true }
                ]
            },
            publications: {
                path: 'components/data/publications.ts',
                type: 'array',
                itemLabel: (item) => item.title,
                fields: [
                    { name: 'title', label: 'Title', type: 'text' },
                    { name: 'authors', label: 'Authors', type: 'text', array: true },
                    { name: 'venue', label: 'Venue', type: 'text' },
                    { name: 'year', label: 'Year', type: 'text' },
                    { name: 'thumbnail', label: 'Thumbnail Path', type: 'text' },
                    { name: 'links.project', label: 'Project URL', type: 'text' },
                    { name: 'links.arxiv', label: 'ArXiv URL', type: 'text' },
                    { name: 'links.code', label: 'Code URL', type: 'text' },
                    { name: 'links.pdf', label: 'PDF URL', type: 'text' }
                ]
            }
        };

        // Helper: Get nested value
        function getNestedValue(obj, path) {
            return path.split('.').reduce((acc, part) => acc && acc[part], obj);
        }

        // Helper: Set nested value
        function setNestedValue(obj, path, value) {
            const parts = path.split('.');
            const lastPart = parts.pop();
            const target = parts.reduce((acc, part) => {
                if (!acc[part]) acc[part] = {};
                return acc[part];
            }, obj);
            target[lastPart] = value;
        }

        // Load file
        async function loadFile() {
            const selectedFile = fileSelect.value;
            if (!selectedFile) {
                alert('Please select a file');
                return;
            }

            const config = fileConfigs[selectedFile];

            try {
                const response = await fetch(`https://raw.githubusercontent.com/jjihwan/jjihwan.github.io/refs/heads/main/components/data/${selectedFile}.json`);
                if (!response.ok) throw new Error(`File not found: ${selectedFile}.json`);
                originalContent = await response.text();

                console.log('Raw content:', originalContent);

                // Parse JSON file
                currentData = JSON.parse(originalContent);
                console.log('Parsed data:', currentData);
                currentFile = selectedFile;

                // Render UI
                renderEditor(config);

                saveBtn.disabled = false;
            } catch (error) {
                console.error('Error loading file:', error);
                alert('Error loading file: ' + error.message);
            }
        }

        // Render editor
        function renderEditor(config) {
            mainContent.innerHTML = '';

            if (!currentData) {
                mainContent.innerHTML = `
                    <div class="empty-state">
                        <h3>Error loading data</h3>
                        <p>Could not parse the file contents</p>
                    </div>
                `;
                return;
            }

            const container = document.createElement('div');
            container.className = 'editor-container';

            // Header with add button for arrays
            if (config.type === 'array') {
                const header = document.createElement('div');
                header.className = 'card-header';
                header.innerHTML = `
                    <h2 class="section-title">${currentFile} Items (${currentData.length})</h2>
                    <button class="btn btn-primary" onclick="addItem()">Add Item</button>
                `;
                container.appendChild(header);
            } else {
                container.innerHTML = `<h2 class="section-title">Edit ${currentFile}</h2>`;
            }

            // Render fields
            if (config.type === 'array') {
                currentData.forEach((item, index) => {
                    container.appendChild(renderArrayItem(item, index, config));
                });
            } else {
                container.appendChild(renderObjectForm(currentData, config));
            }

            mainContent.appendChild(container);
        }

        // Render array item
        function renderArrayItem(item, index, config) {
            const div = document.createElement('div');
            div.className = 'array-item';
            div.dataset.index = index;

            const header = document.createElement('div');
            header.className = 'array-item-header';
            header.innerHTML = `
                <span class="array-item-title">#${index + 1} ${config.itemLabel(item)}</span>
                <div class="card-actions">
                    <button class="btn btn-danger btn-small" onclick="deleteItem(${index})">Delete</button>
                    <button class="btn btn-secondary btn-small" onclick="moveItem(${index}, -1)">↑</button>
                    <button class="btn btn-secondary btn-small" onclick="moveItem(${index}, 1)">↓</button>
                </div>
            `;

            const fields = renderFields(item, config.fields, index);
            fields.className = 'fields-container';

            div.appendChild(header);
            div.appendChild(fields);
            return div;
        }

        // Render object form
        function renderObjectForm(data, config) {
            const card = document.createElement('div');
            card.className = 'card';
            card.appendChild(renderFields(data, config.fields));
            return card;
        }

        // Render fields
        function renderFields(data, fields, parentIndex = null) {
            const container = document.createElement('div');

            fields.forEach(field => {
                const group = document.createElement('div');
                group.className = 'form-group';

                const label = document.createElement('label');
                label.textContent = field.label;
                group.appendChild(label);

                let value = getNestedValue(data, field.name);

                if (field.array) {
                    // Array field
                    const arrayContainer = document.createElement('div');
                    arrayContainer.className = 'array-field';

                    if (Array.isArray(value)) {
                        value.forEach((item, arrIndex) => {
                            const row = document.createElement('div');
                            row.className = 'field-row';

                            const input = document.createElement(field.type === 'textarea' ? 'textarea' : 'input');
                            input.type = 'text';
                            input.className = 'form-control';
                            input.value = item;
                            input.dataset.field = field.name;
                            input.dataset.arrayIndex = arrIndex;
                            input.dataset.parentIndex = parentIndex !== null ? parentIndex : '';

                            if (field.type === 'richtext' || field.type === 'textarea') {
                                input.rows = 2;
                            }

                            row.appendChild(input);

                            const deleteBtn = document.createElement('button');
                            deleteBtn.className = 'btn btn-danger btn-small';
                            deleteBtn.textContent = '×';
                            deleteBtn.style.width = '40px';
                            deleteBtn.onclick = () => {
                                value.splice(arrIndex, 1);
                                renderEditor(fileConfigs[currentFile]);
                            };
                            row.appendChild(deleteBtn);

                            arrayContainer.appendChild(row);

                            if (field.type === 'richtext') {
                                const toolbar = document.createElement('div');
                                toolbar.className = 'toolbar';
                                toolbar.innerHTML = `
                                    <button class="toolbar-btn" onclick="insertFormat(this, '<b>', '</b>')"><b>B</b></button>
                                    <button class="toolbar-btn" onclick="openLinkModal(this)">🔗 Link</button>
                                `;
                                arrayContainer.insertBefore(toolbar, row);
                            }
                        });
                    }

                    const addBtn = document.createElement('button');
                    addBtn.className = 'btn btn-secondary btn-small';
                    addBtn.textContent = '+ Add Item';
                    addBtn.onclick = () => {
                        if (!Array.isArray(value)) value = [];
                        value.push('');
                        renderEditor(fileConfigs[currentFile]);
                    };

                    arrayContainer.appendChild(addBtn);
                    group.appendChild(arrayContainer);
                } else if (field.type === 'richtext') {
                    // Rich text field
                    const toolbar = document.createElement('div');
                    toolbar.className = 'toolbar';
                    toolbar.innerHTML = `
                        <button class="toolbar-btn" onclick="insertFormat(this, '<b>', '</b>')"><b>B</b></button>
                        <button class="toolbar-btn" onclick="openLinkModal(this)">🔗 Link</button>
                    `;

                    const textarea = document.createElement('textarea');
                    textarea.className = 'form-control';
                    textarea.value = value || '';
                    textarea.dataset.field = field.name;
                    textarea.dataset.parentIndex = parentIndex !== null ? parentIndex : '';
                    textarea.rows = 4;

                    group.appendChild(toolbar);
                    group.appendChild(textarea);
                } else if (field.type === 'textarea') {
                    // Regular textarea
                    const textarea = document.createElement('textarea');
                    textarea.className = 'form-control';
                    textarea.value = value || '';
                    textarea.dataset.field = field.name;
                    textarea.dataset.parentIndex = parentIndex !== null ? parentIndex : '';
                    textarea.rows = 3;
                    group.appendChild(textarea);
                } else {
                    // Regular text input
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'form-control';
                    input.value = value || '';
                    input.dataset.field = field.name;
                    input.dataset.parentIndex = parentIndex !== null ? parentIndex : '';
                    group.appendChild(input);
                }

                container.appendChild(group);
            });

            return container;
        }

        // Insert format tags
        function insertFormat(btn, openTag, closeTag) {
            const textarea = btn.parentElement.nextElementSibling;
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            const selectedText = text.substring(start, end);
            const newText = text.substring(0, start) + openTag + selectedText + closeTag + text.substring(end);
            textarea.value = newText;
            textarea.focus();
            textarea.setSelectionRange(start + openTag.length, end + openTag.length);
        }

        // Link modal
        let currentTextarea = null;

        function openLinkModal(btn) {
            currentTextarea = btn.parentElement.nextElementSibling;
            const start = currentTextarea.selectionStart;
            const end = currentTextarea.selectionEnd;
            const selectedText = currentTextarea.value.substring(start, end);

            linkModal.classList.add('show');
            document.getElementById('linkUrl').value = '';
            document.getElementById('linkText').value = selectedText;
            document.getElementById('linkNewTab').checked = true;

            if (selectedText) {
                document.getElementById('linkUrl').focus();
            } else {
                document.getElementById('linkText').focus();
            }
        }

        document.getElementById('cancelLinkBtn').onclick = () => {
            linkModal.classList.remove('show');
        };

        document.getElementById('insertLinkBtn').onclick = () => {
            const url = document.getElementById('linkUrl').value;
            const linkText = document.getElementById('linkText').value || url;
            const newTab = document.getElementById('linkNewTab').checked;

            if (!url) {
                alert('Please enter a URL');
                return;
            }

            const linkTag = `<a href="${url}"${newTab ? ' target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:text-blue-800 underline"' : ''}>${linkText}</a>`;

            const textarea = currentTextarea;
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const textareaContent = textarea.value;
            const newText = textareaContent.substring(0, start) + linkTag + textareaContent.substring(end);
            textarea.value = newText;
            textarea.focus();

            linkModal.classList.remove('show');
        };

        // Add item
        function addItem() {
            const config = fileConfigs[currentFile];
            const newItem = {};

            config.fields.forEach(field => {
                if (field.array) {
                    setNestedValue(newItem, field.name, []);
                } else if (field.type === 'richtext') {
                    setNestedValue(newItem, field.name, '');
                } else if (field.type === 'textarea') {
                    setNestedValue(newItem, field.name, '');
                } else {
                    setNestedValue(newItem, field.name, '');
                }
            });

            currentData.push(newItem);
            renderEditor(config);
        }

        // Delete item
        function deleteItem(index) {
            if (confirm('Are you sure you want to delete this item?')) {
                currentData.splice(index, 1);
                renderEditor(fileConfigs[currentFile]);
            }
        }

        // Move item
        function moveItem(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= currentData.length) return;

            const temp = currentData[index];
            currentData[index] = currentData[newIndex];
            currentData[newIndex] = temp;

            renderEditor(fileConfigs[currentFile]);
        }

        // Collect data from form
        function collectFormData() {
            const config = fileConfigs[currentFile];
            const inputs = mainContent.querySelectorAll('input[type="text"], textarea');
            const parentMap = {};

            inputs.forEach(input => {
                const fieldPath = input.dataset.field;
                const parentIndex = input.dataset.parentIndex !== '' ? parseInt(input.dataset.parentIndex) : null;
                const arrayIndex = input.dataset.arrayIndex !== undefined ? parseInt(input.dataset.arrayIndex) : null;

                if (parentIndex !== null && arrayIndex !== null) {
                    // Array field within array item
                    if (!parentMap[parentIndex]) parentMap[parentIndex] = {};
                    if (!parentMap[parentIndex][fieldPath]) parentMap[parentIndex][fieldPath] = [];

                    const value = input.value.trim();
                    if (value) parentMap[parentIndex][fieldPath][arrayIndex] = value;
                } else if (parentIndex !== null) {
                    // Regular field within array item
                    if (!parentMap[parentIndex]) parentMap[parentIndex] = {};
                    parentMap[parentIndex][fieldPath] = input.value.trim();
                } else if (arrayIndex !== null) {
                    // Array field in object
                    if (!parentMap.array) parentMap.array = {};
                    if (!parentMap.array[fieldPath]) parentMap.array[fieldPath] = [];

                    const value = input.value.trim();
                    if (value) parentMap.array[fieldPath][arrayIndex] = value;
                } else {
                    // Regular field in object
                    setNestedValue(currentData, fieldPath, input.value.trim());
                }
            });

            // Apply array field changes
            Object.keys(parentMap).forEach(parentIndex => {
                if (parentIndex === 'array') {
                    Object.keys(parentMap.array).forEach(fieldPath => {
                        const arr = parentMap.array[fieldPath].filter(v => v !== undefined);
                        setNestedValue(currentData, fieldPath, arr);
                    });
                } else {
                    const itemData = parentMap[parentIndex];
                    Object.keys(itemData).forEach(fieldPath => {
                        if (Array.isArray(itemData[fieldPath])) {
                            const arr = itemData[fieldPath].filter(v => v !== undefined);
                            setNestedValue(currentData[parseInt(parentIndex)], fieldPath, arr);
                        } else {
                            setNestedValue(currentData[parseInt(parentIndex)], fieldPath, itemData[fieldPath]);
                        }
                    });
                }
            });
        }

        // Generate JSON content
        function generateJSONContent(data, config) {
            return JSON.stringify(data, null, 2);
        }

        // Save file
        async function saveFile() {
            collectFormData();

            const config = fileConfigs[currentFile];
            const newContent = generateJSONContent(currentData, config);

            try {
                const blob = new Blob([newContent], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${currentFile}.json`;
                a.click();
                URL.revokeObjectURL(url);

                originalContent = newContent;

                showStatus('File downloaded! Upload to GitHub manually.', 'success');
            } catch (error) {
                console.error('Error saving file:', error);
                alert('Error saving file: ' + error.message);
            }
        }

        // Show status message
        function showStatus(message, type) {
            const div = document.createElement('div');
            div.className = `status-message status-${type}`;
            div.textContent = message;
            document.body.appendChild(div);

            setTimeout(() => {
                div.remove();
            }, 3000);
        }

        // Event listeners
        fileSelect.addEventListener('change', loadFile);
        saveBtn.addEventListener('click', saveFile);

        // Close modal on outside click
        linkModal.addEventListener('click', (e) => {
            if (e.target === linkModal) {
                linkModal.classList.remove('show');
            }
        });
    </script>
</body>
